name: Python Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLCONFIGDIR: /tmp/infinity-agents-matplotlib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          mkdir -p "$MPLCONFIGDIR"
          python -c 'import os; import matplotlib; matplotlib.use("Agg"); import matplotlib.pyplot as plt; plt.figure(); plt.plot([0, 1], [0, 1]); plt.savefig(os.path.join(os.environ["MPLCONFIGDIR"], "warmup.png")); plt.close("all")'

      # Keep each pytest process below the hosted runner's short command
      # cancellation threshold while still running the complete test suite.
      - name: Run core unit tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin -q tests/test_*.py

      - name: Run search tool tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -p pytest_asyncio.plugin -q
          tests/tools/test_arxiv_agno.py
          tests/tools/test_file_tools.py
          tests/tools/test_literature_search.py

      - name: Run paper search tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin -q tests/tools/test_paper_search.py

      - name: Run plotting and image tool tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -p pytest_asyncio.plugin -q
          tests/tools/test_plotly_and_image_tools.py
          tests/tools/test_python_plotter.py
