name: Python Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLCONFIGDIR: /tmp/infinity-agents-matplotlib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          mkdir -p "$MPLCONFIGDIR"
          python -c 'import os; import matplotlib; matplotlib.use("Agg"); import matplotlib.pyplot as plt; plt.figure(); plt.plot([0, 1], [0, 1]); plt.savefig(os.path.join(os.environ["MPLCONFIGDIR"], "warmup.png")); plt.close("all")'

      # Keep each pytest process below the hosted runner's short command
      # cancellation threshold while still running the complete test suite.
      - name: Run test analysis agent
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin -q tests/test_analysis_agent.py

      - name: Run test analysis contract
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin -q tests/test_analysis_contract.py

      - name: Run test app
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin -q tests/test_app.py

      - name: Run test artifact download
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin -q tests/test_artifact_download.py

      - name: Run test auth and streaming
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin -q tests/test_auth_and_streaming.py

      - name: Run test auth flow
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin -q tests/test_auth_flow.py

      - name: Run test cancellation
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin -q tests/test_cancellation.py

      - name: Run test concurrency recovery
        env:
