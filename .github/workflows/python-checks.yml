name: Python Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLCONFIGDIR: /tmp/infinity-agents-matplotlib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          mkdir -p "$MPLCONFIGDIR"
          python -c 'import os; import matplotlib; matplotlib.use("Agg"); import matplotlib.pyplot as plt; plt.figure(); plt.plot([0, 1], [0, 1]); plt.savefig(os.path.join(os.environ["MPLCONFIGDIR"], "warmup.png")); plt.close("all")'

      - name: Run unit tests
        # Tests that require real PostgreSQL/Redis intentionally skip unless
        # the corresponding service URLs are explicitly provided.
        env:
          # The hosted runner may provide unrelated global pytest plugins.
          # Load only the project-supported asyncio plugin for deterministic CI.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set +e
          python -m pytest -p pytest_asyncio.plugin -q &
          pytest_pid=$!
          while kill -0 "$pytest_pid" 2>/dev/null; do
            echo "pytest is still finalizing (pid=$pytest_pid)"
            sleep 2
          done
          wait "$pytest_pid"
          pytest_status=$?
          echo "pytest exit code: $pytest_status"
          exit "$pytest_status"
