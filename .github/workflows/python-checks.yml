name: Python Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        env:
          # Tests replace the pool with a fake before startup; this only keeps
          # configuration importable without a production database secret.
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/infinity_test
        run: pytest -q
