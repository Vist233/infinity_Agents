name: Python Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        # Tests that require real PostgreSQL/Redis intentionally skip unless
        # the corresponding service URLs are explicitly provided.
        run: |
          pytest -q &
          test_pid=$!
          while kill -0 "$test_pid" 2>/dev/null; do
            echo "pytest is still finishing..."
            sleep 2
          done
          wait "$test_pid"
