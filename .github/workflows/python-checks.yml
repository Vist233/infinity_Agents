name: Python Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLCONFIGDIR: /tmp/infinity-agents-matplotlib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          mkdir -p "$MPLCONFIGDIR"
          python -c 'import os; import matplotlib; matplotlib.use("Agg"); import matplotlib.pyplot as plt; plt.figure(); plt.plot([0, 1], [0, 1]); plt.savefig(os.path.join(os.environ["MPLCONFIGDIR"], "warmup.png")); plt.close("all")'

      # Keep each pytest process below the hosted runner's short command
      # cancellation threshold while still running the complete test suite.
      - name: Run core tests 1
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -p pytest_asyncio.plugin -q
          tests/test_analysis_agent.py
          tests/test_analysis_contract.py
          tests/test_app.py
          tests/test_artifact_download.py
          tests/test_auth_and_streaming.py
          tests/test_auth_flow.py
          tests/test_cancellation.py
          tests/test_concurrency_recovery.py

      - name: Run core tests 2
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -p pytest_asyncio.plugin -q
          tests/test_dataset_safety.py
          tests/test_db_rls.py
          tests/test_direct_runtime.py
          tests/test_fault_injection.py
          tests/test_model_gateway.py
          tests/test_paper_agent_runner.py
          tests/test_paper_reader_workflow.py
          tests/test_papers_repo_pg.py

      - name: Run core tests 3
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -p pytest_asyncio.plugin -q
          tests/test_provider.py
          tests/test_pubmed_pmc.py
          tests/test_pubmed_tools.py
          tests/test_rate_limit.py
          tests/test_redis_workers.py
          tests/test_regression.py
          tests/test_retry_and_recovery.py
          tests/test_search_papers.py

      - name: Run core tests 4
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -p pytest_asyncio.plugin -q
          tests/test_security.py
          tests/test_security_boundaries.py
          tests/test_sse_reconnection.py
          tests/test_task_api.py
          tests/test_task_integration_pg.py
          tests/test_task_ownership.py
          tests/test_task_state_machine.py
          tests/test_verifier.py
          tests/test_worker_enrollment.py

      - name: Run search tool tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -p pytest_asyncio.plugin -q
          tests/tools/test_arxiv_agno.py
          tests/tools/test_file_tools.py
          tests/tools/test_literature_search.py

      - name: Run paper search tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin -q tests/tools/test_paper_search.py

      - name: Run plotting and image tool tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -p pytest_asyncio.plugin -q
          tests/tools/test_plotly_and_image_tools.py
          tests/tools/test_python_plotter.py
