name: Python Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        # Tests that require real PostgreSQL/Redis intentionally skip unless
        # the corresponding service URLs are explicitly provided.
        env:
          # The hosted runner may provide unrelated global pytest plugins.
          # Load only the project-supported asyncio plugin for deterministic CI.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin -q
