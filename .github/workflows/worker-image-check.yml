name: Worker image check

on:
  workflow_dispatch:
  push:
    branches: [cloudflare-deploy]
    paths:
      - "backend/Dockerfile.worker"
      - "backend/**"
      - "requirements.txt"
      - "docker-compose.cloudflare-workers.yml"
      - ".github/workflows/worker-image-check.yml"

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: "2.1.226"

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Worker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.worker
          platforms: linux/amd64
          load: true
          tags: infinity-agent-worker:ci
          build-args: |
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate arm64 build definition without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.worker
          platforms: linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/infinity-agent-worker-arm64.oci.tar
          build-args: |
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Smoke test runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint claude infinity-agent-worker:ci --version \
            | grep -Eq "^${CLAUDE_CODE_VERSION}([[:space:]]|$)"
          if docker run --rm --entrypoint sh infinity-agent-worker:ci -c 'command -v docker'; then
            echo "Docker CLI must not be present in the Worker image" >&2
            exit 1
          fi
          docker run --rm --entrypoint python infinity-agent-worker:ci -m compileall -q /app/backend

      - name: Scan repository for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if rg -n --hidden --glob '!.git/**' --glob '!*.lock' \
            '(sk-[A-Za-z0-9_-]{20,}|wc_[A-Fa-f0-9]{40,}|gh[pousr]_[A-Za-z0-9]{20,}|ANTHROPIC_(API_KEY|AUTH_TOKEN)=[A-Za-z0-9_-]{24,}|postgres(ql)?://[^$<{[:space:]]+:[^$<{[:space:]@]{20,}@|redis(s)?://[^$<{[:space:]@]*:[^$<{[:space:]@]{20,}@|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo "secret-like literal found" >&2
            exit 1
          fi
