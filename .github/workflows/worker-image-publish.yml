name: Publish Worker image

on:
  workflow_dispatch:
  push:
    branches: [cloudflare-deploy]
    paths:
      - "backend/Dockerfile.worker"
      - "backend/**"
      - "requirements.worker.txt"
      - ".dockerignore"
      - ".github/workflows/worker-image-publish.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/vist233/infinity-agent-worker
  CLAUDE_CODE_VERSION: "2.1.226"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:v1
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
