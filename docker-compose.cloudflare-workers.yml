# One local acceptance/persistent Worker connected to the Cloudflare control
# plane. The image can be built locally or pulled from GHCR by setting
# WORKER_IMAGE=ghcr.io/<org-or-user>/infinity-agent-worker:v1.
# This file intentionally does not start PostgreSQL, Redis, or a verifier.

x-cloudflare-worker: &cloudflare-worker
  image: ${WORKER_IMAGE:-infinity-agent-worker:cloudflare}
  build:
    context: .
    dockerfile: backend/Dockerfile.worker
  restart: unless-stopped
  command: python -m backend.code_agent.worker.cloudflare_worker

services:
  worker-b:
    <<: *cloudflare-worker
    env_file:
      - path: ${WORKER_ENV_FILE:-worker-b.cloudflare.env}
        required: false
    environment:
      WORKER_WORK_ROOT: /worker-inputs
      WORKER_OUTPUT_ROOT: /worker-outputs
      WORKER_REDIS_REQUIRED: ${WORKER_REDIS_REQUIRED:-1}
      WORKER_RECYCLE_AFTER_TASK: ${WORKER_RECYCLE_AFTER_TASK:-0}
    volumes:
      - worker_b_inputs:/worker-inputs
      - worker_b_outputs:/worker-outputs

volumes:
  worker_b_inputs:
    name: infinity-agents-worker-b-inputs
  worker_b_outputs:
    name: infinity-agents-worker-b-outputs
