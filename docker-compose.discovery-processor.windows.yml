# Independent Windows deployment for the Discovery Processor only.
# This compose project intentionally contains no Worker v2 services.
services:
  discovery-processor:
    build:
      context: .
      dockerfile: backend/Dockerfile.discovery-processor
      args:
        # The deployment script preloads this public base into the Windows
        # Docker cache so the SSH session never needs registry credentials.
        DISCOVERY_PYTHON_BASE: infinity-discovery-python:3.12-slim
    image: infinity-agents-discovery-processor:2026.09.11-r1
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "backend.discovery.processor"]
    env_file:
      - discovery-processor.windows.env
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "2.0"
    pids_limit: 256
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - discovery_processor_work:/var/lib/discovery-processor

volumes:
  discovery_processor_work:
    name: infinity-agents-discovery-processor-work
