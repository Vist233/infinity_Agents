# Infinity Agents — local infrastructure only.
# PostgreSQL + Redis with named volumes and healthchecks.
# API, Frontend, and Workers run on the host machine.
#
# Usage:
#   cp .env.local.example .env.local   # then edit passwords
#   docker compose -f docker-compose.infra.yml --env-file .env.local up -d
#   docker compose -f docker-compose.infra.yml --env-file .env.local ps
#
# Stop (data preserved):
#   docker compose -f docker-compose.infra.yml down
#
# Destroy (data lost):
#   docker compose -f docker-compose.infra.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infinity_local}
      POSTGRES_USER: ${POSTGRES_USER:-infinity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pg_data:
  redis_data:
