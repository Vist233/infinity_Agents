# Two independently authenticated Windows Docker Workers for the fixed public
# pool. Each service receives its identity only from its own local env file;
# neither service shares a workspace volume or credential with the other.
services:
  worker-1:
    # This is an administrator-loaded local tag; the Windows host must not
    # pull a public registry image at startup.
    image: infinity-agents-worker:2026.09.12-r2
    pull_policy: never
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    command: ["python", "-m", "backend.code_agent.worker.consumer_v2"]
    env_file:
      - worker-1.cloudflare.env
    volumes:
      - worker_1_workspace:/workspace

  worker-2:
    image: infinity-agents-worker:2026.09.12-r2
    pull_policy: never
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    command: ["python", "-m", "backend.code_agent.worker.consumer_v2"]
    env_file:
      - worker-2.cloudflare.env
    volumes:
      - worker_2_workspace:/workspace

  discovery-processor:
    image: infinity-agents-discovery-processor:2026.09.11-r1
    pull_policy: never
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    command: ["python", "-m", "backend.discovery.processor"]
    env_file:
      - discovery-processor.cloudflare.env
    volumes:
      - discovery_processor_work:/var/lib/discovery-processor

volumes:
  worker_1_workspace:
    name: infinity-agents-worker-1-workspace
  worker_2_workspace:
    name: infinity-agents-worker-2-workspace
  discovery_processor_work:
    name: infinity-agents-discovery-processor-work
