# Local smoke-test alias for the Cloudflare D1 Worker v2 contract.
#
# This file deliberately does not start PostgreSQL, Redis, an Outbox service,
# a Reaper, or a verifier. D1/R2 and zhangbot Redis are administrator-managed
# remote services; the Worker reaches them only through HTTPS.
#
# Use a local image tag for a smoke test or a pinned GHCR digest for a real
# Worker. The filled env file is ignored by Git.

services:
  worker-b:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be supplied as a local tag or pinned GHCR digest}
    env_file:
      - path: ${WORKER_ENV_FILE:-worker.cloudflare.env}
        required: false
    environment:
      WORKER_ID: ${WORKER_ID:?WORKER_ID must be supplied by the server-issued credential bundle}
      WORKER_INSTANCE_ID: ${WORKER_INSTANCE_ID:?WORKER_INSTANCE_ID must be unique for this container}
      WORKER_PROTOCOL_VERSION: "2"
      WORKER_RUNTIME_CAPABILITY: "goal-driven-claude-code"
      WORKER_IMAGE_DIGEST: ${WORKER_IMAGE_DIGEST:-}
      WORKER_CREDENTIAL: ${WORKER_CREDENTIAL:?WORKER_CREDENTIAL must be supplied by the server-issued credential bundle}
      WORKER_CONTROL_PLANE_URL: ${WORKER_CONTROL_PLANE_URL:?WORKER_CONTROL_PLANE_URL must be supplied by the administrator}
      WORKER_RELAY_URL: ${WORKER_RELAY_URL:?WORKER_RELAY_URL must be supplied by the administrator}
      WORKER_RELAY_HINT_TOKEN: ${WORKER_RELAY_HINT_TOKEN:?WORKER_RELAY_HINT_TOKEN must be supplied by the administrator}
      CODE_AGENT_EXECUTOR_MODE: direct
    volumes:
      - worker_b_workspace:/workspace

volumes:
  worker_b_workspace:
    name: infinity-agents-local-worker-b-workspace
