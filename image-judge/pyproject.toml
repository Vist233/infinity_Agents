[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "imagejudge"
version = "0.2.0"
description = "ImageJudge desktop visual classification client"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "pydantic>=2.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "Pillow>=10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
packaging = [
    "pyinstaller>=6.6",
]

[project.gui-scripts]
imagejudge = "imagejudge.main:main"

[tool.setuptools.packages.find]
where = ["apps/desktop"]
include = ["imagejudge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/desktop"]
