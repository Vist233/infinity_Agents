[project]
name = "infinity-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.4.7",
    "arxiv>=2.4.0",
    "asyncpg>=0.31.0",
    "claude-agent-sdk>=0.1.27",
    "fastapi>=0.128.0",
    "openai>=2.16.0",
    "pypdf>=6.15.0",
    "typing>=3.10.0.0",
    "uvicorn>=0.40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires external services or live network access",
]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.ruff.lint.per-file-ignores]
# The legacy FastAPI module is intentionally assembled in import sections so
# its compatibility routes can stay below the original PaperAgent code.
"backend/app.py" = ["E402"]
