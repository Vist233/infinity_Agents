<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinity run viewer</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1b1f27; --muted: #5d6675; --line: #d9dde4; --grid: #e8ebf0;
    --c1: #2f6fd6; --c2: #d8731a; --c3: #168f80; --c4: #8a5cc7; --bad: #c8372d; --warn: #b7791f; --good: #1d8a4b; --band: rgba(200, 55, 45, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151a; --card: #1a1e25; --ink: #e6e9ee; --muted: #9aa3b2; --line: #343b47; --grid: #262c36;
      --c1: #6aa0ff; --c2: #f0a04b; --c3: #4cc7b4; --c4: #b794f0; --bad: #ff7a70; --warn: #e0b04a; --good: #5fd08b; --band: rgba(255, 122, 112, 0.16);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151a; --card: #1a1e25; --ink: #e6e9ee; --muted: #9aa3b2; --line: #343b47; --grid: #262c36;
    --c1: #6aa0ff; --c2: #f0a04b; --c3: #4cc7b4; --c4: #b794f0; --bad: #ff7a70; --warn: #e0b04a; --good: #5fd08b; --band: rgba(255, 122, 112, 0.16);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 14px; margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(160px, 45%), 1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .tile b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .tile span { color: var(--muted); font-size: 12px; }
  .pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.running { color: var(--good); border-color: var(--good); }
  .pill.stopped { color: var(--warn); border-color: var(--warn); }
  .attention { border-left: 3px solid var(--warn); }
  .attention ul { margin: 0; padding-left: 18px; }
  .attention li { margin: 2px 0; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 16px; align-items: start; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; align-items: start; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .legend i { display: inline-block; width: 10px; height: 3px; margin-right: 4px; vertical-align: middle; border-radius: 2px; }
  .empty { color: var(--muted); font-size: 12px; padding: 8px 0; }
  .wrap { overflow-x: auto; max-height: 460px; overflow-y: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--card); }
  td.l, th.l { text-align: left; white-space: normal; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--muted); vertical-align: middle; }
  .dot.live { background: var(--good); }
  .quiet { color: var(--muted); }
  details.card > summary { cursor: pointer; font-weight: 600; }
  details.card[open] > summary { margin-bottom: 12px; }
  details .grid, details section { margin-top: 12px; }
  .item { border-bottom: 1px solid var(--grid); padding: 6px 0; }
  .item small { color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); margin-right: 4px; }
  .badge.denied, .badge.error { color: var(--bad); border-color: var(--bad); }
  .badge.steer { color: var(--warn); border-color: var(--warn); }
  .tip { position: fixed; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; display: none; z-index: 5; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  select { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  .tall { max-height: 380px; overflow: auto; }
  .result { display: grid; gap: 10px; }
  .result .score { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .result .who { color: var(--muted); }
  .result dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
  .result dt { color: var(--muted); }
  .result dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  .status { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
  .status b { font-variant-numeric: tabular-nums; }
  .bar { height: 4px; background: var(--grid); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--c1); }
  .footnote { color: var(--muted); font-size: 12px; margin: 0; padding-left: 18px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="title">Infinity run</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div><label class="sub">Run <select id="runs"></select></label> <span id="state" class="pill"></span></div>
  </header>
  <section class="card result" id="result"></section>
  <section class="card" id="progress"></section>
  <section class="card attention" id="attention" hidden><h2>Needs you</h2><ul id="attentionList"></ul></section>
  <div class="two">
    <section class="card"><h2>Score over time</h2><div id="scores"></div></section>
    <section class="card"><h2>Agents, best first</h2><div class="wrap"><table id="board"></table></div></section>
  </div>
  <details class="card" id="more">
    <summary>Machine</summary>
    <div class="grid" id="machine"></div>
  </details>
  <ul class="footnote" id="notes"></ul>
</main>
<div class="tip" id="tip"></div>
<script>
"use strict";
// The page answers what a person running many agents on one task wants to know, in this order:
// what is the best result and where is it; how far the run is and how much is left; is anything waiting on me; is it still getting better; who is ahead.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const params = new URLSearchParams(location.search);
const runParam = params.get("run") || "";
const q = (path) => fetch(path + (path.includes("?") ? "&" : "?") + "run=" + encodeURIComponent(runParam), { cache: "no-store" }).then((r) => r.json());

let data = null;
/** An agent that has worked this long without a submit is worth a look (the agents are reminded at the same point). */
const NO_SUBMIT_MINUTES = 20;

function fmtDur(ms) {
  if (ms == null || !Number.isFinite(ms)) return "-";
  const s = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return h > 0 ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m ${String(r).padStart(2, "0")}s`;
}
const fmtMin = (ts, t0) => (ts == null || t0 == null ? "-" : (Math.round(((ts - t0) / 60000) * 10) / 10).toFixed(1));
function fmtNum(n) {
  if (n == null) return "-";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + " M";
  if (n >= 1e4) return Math.round(n / 1e3) + " k";
  return String(Math.round(n));
}
const fmtScore = (s) => (s == null ? "-" : String(Math.round(s * 100000) / 100000));

// ---------- charts ----------
const charts = new Map();

function niceTicks(lo, hi, n) {
  const span = hi - lo || 1;
  const raw = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((s) => s >= raw) || raw;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-6; v += step) out.push(Math.round(v / step * 1e6) / 1e6 * step);
  return out;
}
function timeTicks(t0, t1) {
  const spanMin = (t1 - t0) / 60000;
  const step = [1, 2, 5, 10, 15, 30, 60, 120, 240].find((s) => spanMin / s <= 8) || 240;
  const out = [];
  for (let m = 0; m <= spanMin + 1e-6; m += step) out.push(t0 + m * 60000);
  return out;
}

/** Draws one chart into `host`. spec: {id, h, t0, t1, yMin, yMax, yFmt, series, marks, hlines, points, extra, ticksY} */
function drawChart(host, spec) {
  const W = Math.max(280, host.clientWidth || 600);
  const H = spec.h || 150;
  const m = { l: 44, r: 10, t: 14, b: 22 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const x = (t) => m.l + ((t - spec.t0) / Math.max(1, spec.t1 - spec.t0)) * pw;
  const y = (v) => m.t + ph - ((v - spec.yMin) / Math.max(1e-9, spec.yMax - spec.yMin)) * ph;
  let g = "";
  for (const v of spec.ticksY || niceTicks(spec.yMin, spec.yMax, 4)) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${esc(spec.yFmt ? spec.yFmt(v) : v)}</text>`;
  }
  for (const t of timeTicks(spec.t0, spec.t1)) {
    g += `<text x="${x(t)}" y="${H - 6}" text-anchor="middle">${Math.round((t - spec.t0) / 60000)}m</text>`;
  }
  for (const b of spec.bands || []) g += `<rect x="${x(b[0])}" y="${m.t}" width="${Math.max(1, x(b[1]) - x(b[0]))}" height="${ph}" fill="var(--band)"/>`;
  for (const r of spec.marks || []) {
    g += `<line x1="${x(r.ts)}" x2="${x(r.ts)}" y1="${m.t}" y2="${m.t + ph}" stroke="var(--muted)" stroke-dasharray="3 3" opacity=".6"/>`;
    if (r.label) g += `<text x="${x(r.ts) + 2}" y="${m.t + 9}">${esc(r.label)}</text>`;
  }
  for (const h of spec.hlines || []) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(h.v)}" y2="${y(h.v)}" stroke="${h.color || "var(--muted)"}" stroke-dasharray="5 4"/>`;
  for (const s of spec.series) {
    const pts = s.pts.filter((p) => p[1] != null);
    if (pts.length === 0) continue;
    let d = "";
    pts.forEach((p, i) => {
      const px = x(p[0]), py = y(Math.min(spec.yMax, Math.max(spec.yMin, p[1])));
      if (i === 0) d += `M${px.toFixed(1)} ${py.toFixed(1)}`;
      else if (s.step) d += `H${px.toFixed(1)}V${py.toFixed(1)}`;
      else d += `L${px.toFixed(1)} ${py.toFixed(1)}`;
    });
    if (s.step && !s.noExtend) d += `H${x(spec.t1).toFixed(1)}`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 1.6}" stroke-linejoin="round"/>`;
  }
  for (const p of spec.points || []) g += p;
  g += `<line class="cross" x1="0" x2="0" y1="${m.t}" y2="${m.t + ph}" stroke="var(--ink)" opacity="0" />`;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.label || "chart")}">${g}<rect class="hit" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="transparent"/></svg>`;
  const svg = host.firstElementChild;
  charts.set(host.id, { spec, x, W });
  svg.querySelector(".hit").addEventListener("mousemove", (ev) => hover(ev, host, svg, spec, m, W));
  svg.querySelector(".hit").addEventListener("mouseleave", () => { $("tip").style.display = "none"; svg.querySelector(".cross").setAttribute("opacity", "0"); });
  return { x, y };
}

function hover(ev, host, svg, spec, m, W) {
  const box = svg.getBoundingClientRect();
  const px = ((ev.clientX - box.left) / box.width) * W;
  const t = spec.t0 + ((px - m.l) / (W - m.l - m.r)) * (spec.t1 - spec.t0);
  const rows = [];
  for (const s of spec.series) {
    let best = null;
    for (const p of s.pts) if (p[1] != null && (best === null || Math.abs(p[0] - t) < Math.abs(best[0] - t))) best = p;
    if (best && Math.abs(best[0] - t) < (spec.t1 - spec.t0) / 20) rows.push(`<span style="color:${s.color}">${esc(s.name)}</span> ${esc(spec.yFmt ? spec.yFmt(best[1]) : best[1])}`);
  }
  const cross = svg.querySelector(".cross");
  cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("opacity", ".35");
  const tip = $("tip");
  tip.innerHTML = `<b>${Math.round(((t - spec.t0) / 60000) * 10) / 10} min</b><br>${rows.join("<br>") || "no reading"}`;
  tip.style.display = "block";
  tip.style.left = Math.min(innerWidth - 180, ev.clientX + 12) + "px";
  tip.style.top = ev.clientY + 12 + "px";
}

function legend(items) {
  return `<div class="legend">${items.map((i) => `<span><i style="background:${i[1]}"></i>${esc(i[0])}</span>`).join("")}</div>`;
}

// ---------- rendering ----------
function render() {
  const { run, series, agents } = data;
  const t0 = series.startedAt ?? run.startedAt;
  const live = run.state === "running";
  const endTs = run.endedAt ?? run.lastTs ?? t0;
  const t1 = Math.max(endTs || 0, (series.machine.at(-1) || {}).ts || 0, t0 + 60000);
  const now = live ? Math.max(Date.now(), endTs) : endTs;
  document.title = `${run.task || "run"} - Infinity run viewer`;
  $("title").textContent = run.task || "Infinity run";
  $("subtitle").textContent = run.name;
  const st = $("state"); st.textContent = run.state === "finished" && run.endReason ? `finished: ${run.endReason}` : run.state; st.className = "pill " + run.state;

  drawResult(run, t0);
  drawProgress(run, series, now, t0, live);
  const items = attention(run, series, agents, now);
  $("attention").hidden = items.length === 0;
  $("attentionList").innerHTML = items.map((text) => `<li>${esc(text)}</li>`).join("");
  drawScores(series, t0, t1, run.metricDirection);
  drawBoard(run.leaderboard, agents, now, live);
  if ($("more").open) drawMachine(series, run, t0, t1);
  $("notes").innerHTML = run.warnings.map((w) => `<li>${esc(w)}</li>`).join("");
}

/** The deliverable: the best result, who made it, and how to get it back. */
function drawResult(run, t0) {
  const best = run.best;
  if (!best) {
    $("result").innerHTML = `<h2>Best result</h2><div class="score">-</div><div class="who">No scored result yet${run.submits ? ` (${run.submits} submits so far)` : ""}.</div>`;
    return;
  }
  const short = best.commit ? best.commit.slice(0, 10) : "";
  $("result").innerHTML =
    `<h2>Best result</h2><div><span class="score">${esc(fmtScore(best.score))}</span>${best.selfReported ? ` <span class="quiet">self-reported</span>` : ""}</div>` +
    `<div class="who">agent ${best.agent}${best.ts != null && t0 != null ? `, at minute ${Math.round((best.ts - t0) / 60000)}` : ""} · ${run.scoredSubmits} scored submits in all</div>` +
    `<dl>${best.command ? `<dt>Command</dt><dd><code>${esc(best.command)}</code></dd>` : ""}` +
    `${best.files.length ? `<dt>Files</dt><dd>${best.files.map((f) => `<code>${esc(f)}</code>`).join(" ")}</dd>` : ""}` +
    `<dt>Folder</dt><dd><code>${esc(best.workDir)}</code>${short ? ` at commit <code>${esc(short)}</code>` : ""}</dd></dl>`;
}

/** How far the run is: time and tokens against their limits, the agents at work, the machine. */
function drawProgress(run, series, now, t0, live) {
  const elapsed = now - t0;
  const parts = [];
  const shares = [];
  parts.push(`<span>${live ? "Running" : "Ran"} <b>${fmtDur(elapsed)}</b>${run.wallMinutes ? ` of ${fmtDur(run.wallMinutes * 60000)}` : ""}</span>`);
  if (run.wallMinutes) shares.push(elapsed / (run.wallMinutes * 60000));
  if (run.tokensUsed != null) {
    parts.push(`<span><b>${fmtNum(run.tokensUsed)}</b>${run.tokenBudget ? ` of ${fmtNum(run.tokenBudget)}` : ""} tokens</span>`);
    if (run.tokenBudget) shares.push(run.tokensUsed / run.tokenBudget);
  }
  parts.push(`<span><b>${run.agentsLive}</b> of ${run.agentsStarted} agents working</span>`);
  const last = series.machine.at(-1) || {};
  if (live && last.cpuBusy != null && now - last.ts < 5 * 60000) parts.push(`<span>machine CPU <b>${Math.round(last.cpuBusy * 100)}%</b></span>`);
  const share = shares.length ? Math.min(1, Math.max(...shares)) : null;
  $("progress").innerHTML = `<div class="status">${parts.join("")}</div>${share != null ? `<div class="bar" title="the limit that is closest"><i style="width:${(share * 100).toFixed(1)}%"></i></div>` : ""}`;
}

/** Only what a person can act on; empty when nothing. */
function attention(run, series, agents, now) {
  const out = [];
  if (run.state === "stopped") out.push("Nothing was written for several minutes. Check the machine's CPU and the agents' folders before restarting anything: a long training writes no log lines.");
  const silent = agents.filter((a) => a.endedAt == null && a.startedAt != null && a.submits === 0 && now - a.startedAt > NO_SUBMIT_MINUTES * 60000);
  if (run.state === "running" && silent.length > 0)
    out.push(`${silent.length === 1 ? "Agent" : "Agents"} ${silent.map((a) => a.agent).join(", ")} ${silent.length === 1 ? "has" : "have"} worked over ${NO_SUBMIT_MINUTES} minutes without a submit (they are reminded in every request).`);
  const last = series.machine.at(-1) || {};
  if (run.state === "running" && last.slotsWaiting > 0) out.push(`${last.slotsWaiting} heavy command${last.slotsWaiting === 1 ? " is" : "s are"} waiting for a CPU slot.`);
  if (last.memUsedMb != null && last.memTotalMb && last.memUsedMb / last.memTotalMb > 0.9) out.push(`Memory is ${Math.round((last.memUsedMb / last.memTotalMb) * 100)}% used.`);
  return out;
}

/** One table for the agents: the ranking, and when each agent last did something. */
function drawBoard(ranking, agents, now, live) {
  const byAgent = new Map(agents.map((a) => [a.agent, a]));
  const ranked = ranking.map((r) => r.agent);
  const rows = [...ranking, ...agents.filter((a) => !ranked.includes(a.agent)).map((a) => ({ rank: null, agent: a.agent, score: null, selfReported: false, submits: a.submits, errors: 0 }))];
  if (rows.length === 0) {
    $("board").innerHTML = `<tr><td class="l empty">No agent has started yet.</td></tr>`;
    return;
  }
  const lastWords = (a) => (!a ? "" : a.endedAt != null ? "ended" : a.lastTs == null ? "started" : `${fmtDur(now - a.lastTs)} ago`);
  $("board").innerHTML =
    `<thead><tr><th>#</th><th class="l">Agent</th><th>Best</th><th>Submits</th><th class="l">Last seen</th></tr></thead><tbody>` +
    rows
      .map((r) => {
        const a = byAgent.get(r.agent);
        const working = live && a && a.startedAt != null && a.endedAt == null;
        const score = r.score == null ? `<span class="quiet">-</span>` : `${fmtScore(r.score)}${r.selfReported ? ` <span class="quiet">self</span>` : ""}`;
        const submits = `${r.submits}${r.errors ? ` <span class="quiet">(${r.errors} failed)</span>` : ""}`;
        return `<tr><td>${r.rank ?? ""}</td><td class="l"><span class="dot${working ? " live" : ""}"></span>${r.agent}</td><td>${score}</td><td>${submits}</td><td class="l quiet">${esc(lastWords(a))}</td></tr>`;
      })
      .join("") +
    `</tbody>`;
}

function drawScores(series, t0, t1, direction) {
  const host = $("scores");
  const ok = series.submits.filter((s) => s.score != null).sort((a, b) => a.ts - b.ts);
  if (ok.length === 0) {
    host.innerHTML = `<div class="empty">No scored submit yet (${series.submits.length} submits, none with a score).</div>`;
    return;
  }
  const lo = Math.min(...ok.map((s) => s.score)), hi = Math.max(...ok.map((s) => s.score));
  const pad = Math.max(0.005, (hi - lo) * 0.1);
  const better = direction === "min" ? Math.min : Math.max;
  let best = ok[0].score;
  const bestPts = ok.map((s) => [s.ts, (best = better(best, s.score))]);
  host.innerHTML = `<div id="scLegend"></div><div id="scChart"></div>`;
  $("scLegend").innerHTML = legend([["best so far", "var(--c3)"], ["submit (hollow: self-reported)", "var(--c1)"]]);
  const spec = { h: 190, t0, t1, yMin: lo - pad, yMax: hi + pad, yFmt: (v) => String(Math.round(v * 1000) / 1000), label: "scored submits", series: [{ name: "best so far", color: "var(--c3)", pts: bestPts, step: true, w: 1.6 }], points: [] };
  const { x, y } = drawChart($("scChart"), spec);
  let pts = "";
  for (const s of ok) {
    pts += `<circle cx="${x(s.ts)}" cy="${y(s.score)}" r="4.5" fill="${s.selfReported ? "var(--card)" : "var(--c1)"}" stroke="var(--c1)" stroke-width="1.6"><title>agent ${s.agent}: ${fmtScore(s.score)} at ${fmtMin(s.ts, t0)} min</title></circle>`;
  }
  $("scChart").firstElementChild.querySelector(".hit").insertAdjacentHTML("beforebegin", pts);
}

/** The machine in three charts: is the CPU used, is memory short, are commands queueing for a slot (and the GPU when there is one). */
function drawMachine(series, run, t0, t1) {
  const host = $("machine");
  const M = series.machine;
  const col = (key, f = (v) => v) => M.map((s) => [s.ts, s[key] == null ? null : f(s[key])]);
  const has = (key) => M.some((s) => s[key] != null);
  const memTotalGb = (M.find((s) => s.memTotalMb != null) || {}).memTotalMb / 1024 || null;
  const gpuTotal = (run.facts || {}).gpuMemTotalMb || null;
  const specs = [
    { id: "m-cpu", title: "CPU busy", ok: has("cpuBusy"), yMax: 100, yFmt: (v) => Math.round(v) + "%", series: [{ name: "CPU busy", color: "var(--c1)", pts: col("cpuBusy", (v) => v * 100) }] },
    { id: "m-mem", title: "Memory used", ok: has("memUsedMb"), yMax: memTotalGb || undefined, yFmt: (v) => Math.round(v) + " GB", series: [{ name: "used", color: "var(--c1)", pts: col("memUsedMb", (v) => v / 1024) }] },
    { id: "m-slots", title: "Commands: running and waiting for a slot", ok: has("slotsInUse") || has("slotsWaiting"), step: true, yFmt: (v) => String(Math.round(v)), series: [{ name: "running", color: "var(--c1)", pts: col("slotsInUse") }, { name: "waiting", color: "var(--bad)", pts: col("slotsWaiting") }] },
    { id: "m-gpu", title: "GPU", ok: has("gpuUtil") || has("gpuMemMb"), yMax: 100, yFmt: (v) => Math.round(v) + "%", series: [{ name: "GPU util", color: "var(--c3)", pts: col("gpuUtil") }, ...(gpuTotal ? [{ name: "GPU memory", color: "var(--c4)", pts: col("gpuMemMb", (v) => (v / gpuTotal) * 100) }] : [])] },
  ].filter((s) => s.ok);
  if (specs.length === 0) {
    host.innerHTML = `<div class="empty">No machine readings in this run.</div>`;
    return;
  }
  host.innerHTML = specs.map((s) => `<div><h2>${esc(s.title)}</h2>${s.series.length > 1 ? legend(s.series.map((x) => [x.name, x.color])) : ""}<div id="${s.id}"></div></div>`).join("");
  for (const s of specs) {
    const vals = s.series.flatMap((x) => x.pts.map((p) => p[1])).filter((v) => v != null);
    const hi = Math.max(...vals, 1e-9);
    drawChart($(s.id), { h: 130, t0, t1, yMin: 0, yMax: Math.max(s.yMax || hi * 1.1, hi * 1.02), yFmt: s.yFmt, series: s.series.map((x) => ({ ...x, step: s.step, noExtend: true, w: 1.4 })), label: s.title });
  }
}

// ---------- loading ----------
async function load() {
  try {
    const [run, series, agents] = await Promise.all([q("/api/run"), q("/api/series"), q("/api/agents")]);
    if (run.error) { $("subtitle").textContent = run.error; return; }
    data = { run, series, agents };
    render();
  } catch (e) { $("subtitle").textContent = "cannot reach the viewer server: " + e; }
}

async function loadRuns() {
  const { runs, current } = await fetch("/api/runs").then((r) => r.json());
  const sel = $("runs");
  sel.innerHTML = runs.map((r) => `<option value="${esc(r.name)}">${esc(r.name)}</option>`).join("");
  sel.value = runParam || current || "";
  sel.disabled = runs.length < 2;
  sel.addEventListener("change", () => { location.search = "?run=" + encodeURIComponent(sel.value); });
}

let timer = null;
function schedule() { clearTimeout(timer); timer = setTimeout(load, 300); }
function stream() {
  try {
    const es = new EventSource("/api/stream?run=" + encodeURIComponent(runParam));
    es.addEventListener("update", schedule);
    es.onerror = () => { es.close(); setTimeout(stream, 5000); };
  } catch (e) { setInterval(load, 5000); }
}
$("more").addEventListener("toggle", () => data && render());
let resizeTimer = null;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => data && render(), 150); });
loadRuns().then(load).then(stream);
</script>
</body>
